name: Mendaera
description: 'Mendaera is a healthcare robotics company building the Focalist handheld
  robotic system, which combines robotics, real-time ultrasound imaging, and software
  to guide needle-based medical procedures with greater precision and consistency.
  The FDA-cleared platform is preparing for broad commercial launch in 2026. Mendaera
  is backed by Lux Capital, Threshold Ventures, Founders Fund, PFM Health Sciences,
  and Puma Venture Capital. The company is focused on medical devices rather than a
  developer-facing platform; as of this profile it publishes no public API, developer
  portal, SDK, or technical documentation surface.'
